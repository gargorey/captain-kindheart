name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      # Debug-signed release build for testers. Configure a real keystore before store upload.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: captain-kindheart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
